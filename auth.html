<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ef9fbd"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout-fixes.css"><title>Account · Lingo Bloom</title></head><body><main class="shell auth-shell"><section class="hero"><h1>Lingo Bloom 🌸</h1><p>Đăng nhập để đồng bộ Library, progress, streak, friends và study groups trên mọi thiết bị.</p><div class="mascot">🐰🌍</div></section><section class="card auth-card"><div id="authStatus" class="notice">Đang kiểm tra backend…</div><div id="signedOutPanel"><h2>Welcome ✨</h2><button id="googleLogin" class="google-btn">G&nbsp;&nbsp; Continue with Google</button><div class="divider"><span>hoặc</span></div><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><label style="margin-top:10px">Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"><div class="button-row" style="margin-top:14px"><button id="emailLogin">Đăng nhập</button><button id="emailSignup" class="ghost">Đăng ký</button></div></div><div id="signedInPanel" hidden><h2>Đã đăng nhập 🌷</h2><div id="accountInfo" class="notice"></div><div class="button-row" style="margin-top:14px"><a class="btn" href="profile.html">Mở profile</a><button id="logoutBtn" class="ghost">Đăng xuất</button></div></div><p class="muted" id="authHint">Dữ liệu của mỗi tài khoản sẽ được tách bằng user_id và bảo vệ bằng RLS.</p><a class="btn ghost" href="index.html">← Về Home</a></section></main><script src="supabase-config.js"></script><script src="backend.js"></script><script>
const statusEl=document.getElementById('authStatus'),out=document.getElementById('signedOutPanel'),inside=document.getElementById('signedInPanel'),info=document.getElementById('accountInfo');
function msg(text,bad=false){statusEl.textContent=text;statusEl.style.borderColor=bad?'#d88':'#e4b6c7'}
function show(st){if(!st.enabled){msg('Backend chưa được tạo — giao diện đã sẵn sàng, cần project Supabase để bật đăng nhập thật.',true);out.hidden=false;inside.hidden=true;return}if(st.error){msg('Không kết nối được backend: '+st.error.message,true);return}if(st.user){msg('Đã kết nối Supabase ✓');out.hidden=true;inside.hidden=false;info.innerHTML='<b>'+(st.user.email||'Google account')+'</b><div class="muted">User ID: '+st.user.id+'</div>'}else{msg('Backend online · chưa đăng nhập');out.hidden=false;inside.hidden=true}}
LingoBackend.onChange(show);
async function act(fn){try{msg('Đang xử lý…');await fn()}catch(e){msg(e.message||String(e),true)}}
googleLogin.onclick=()=>act(()=>LingoBackend.signInGoogle());
emailLogin.onclick=()=>act(()=>LingoBackend.signIn(authEmail.value,authPassword.value));
emailSignup.onclick=()=>act(async()=>{let d=await LingoBackend.signUp(authEmail.value,authPassword.value);msg(d.session?'Đăng ký thành công ✓':'Đã tạo tài khoản. Kiểm tra email nếu Supabase yêu cầu xác minh.')});
logoutBtn.onclick=()=>act(()=>LingoBackend.signOut());
</script></body></html>
